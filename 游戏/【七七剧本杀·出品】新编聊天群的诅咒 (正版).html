0,"y":780},"data":{"kind":"plot","title":"重生","body":"在黑暗之中，我又看见了那个疯老头，身后背着一个算命的牌子，和我那天晚上看见的一样\n他笑着对我说：“不听老人言，吃亏在眼前吧，我告诉你，你们群里面的人已经不是原来的人了，作为群主，你应该找到异常的群员并把它禁言，只要禁言他半小时就好了”","characterIds":[],"mutations":[],"options":[{"id":"option-1785329190998-6wavv9","title":"继续","body":"","mutations":[],"conditions":[],"conditionGroups":[]}]}},{"id":"minigame-18","type":"minigame","position":{"x":120,"y":1884},"data":{"kind":"minigame","title":"小游戏","body":"","minigameResults":[{"id":"success","label":"成功","builtIn":true},{"id":"failure","label":"失败","builtIn":true}],"minigameResultMutations":{"success":[],"failure":[]},"successMutations":[],"failureMutations":[]}},{"id":"minigame-19","type":"minigame","position":{"x":6841.984126984127,"y":808.2195767195768},"data":{"kind":"minigame","title":"寻找异常","body":"","minigameResults":[{"id":"success","label":"成功","builtIn":true},{"id":"failure","label":"失败","builtIn":true}],"minigameResultMutations":{"success":[],"failure":[]},"successMutations":[],"failureMutations":[],"minigameEmbedType":"html","minigameHtmlCode":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n  \u003ctitle>新编聊天群\u003c/title>\n  \u003cstyle>\n    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n    :root{\n      --green:#07C160; --green-light:#95EC69; --green-dark:#06AD56;\n      --bg:#EDEDED; --white:#FFFFFF; --ink:#111; --g1:#333; --g2:#666; --g3:#888; --g4:#B2B2B2; --g5:#D9D9D9; --g6:#F7F7F7;\n      --blue:#576B95; --red:#FA5151; --orange:#FF9500;\n      --font:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Helvetica Neue\",\"Microsoft YaHei\",sans-serif;\n    }\n    html,body{margin:0;padding:0;height:100%;background:#000;font-family:var(--font);user-select:none;-webkit-user-select:none;}\n    button{font-family:var(--font);cursor:pointer;}\n\n    .app{max-width:375px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;}\n\n    /* ===== 通用顶栏 ===== */\n    .nav{height:44px;background:var(--bg);border-bottom:.5px solid var(--g5);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;position:relative;z-index:5;}\n    .nav .back{display:flex;align-items:center;color:var(--ink);font-size:16px;}\n    .nav .title{font-size:17px;font-weight:500;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.1;}\n    .nav .title small{font-size:11px;color:var(--g3);font-weight:400;margin-top:2px;}\n    .nav .right{width:28px;}\n\n    /* ===== 首页会话列表 ===== */\n    .home{flex:1;display:flex;flex-direction:column;overflow:hidden;}\n    .conv-list{flex:1;overflow-y:auto;background:var(--white);}\n    .conv-item{display:flex;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--g6);gap:12px;cursor:pointer;}\n    .conv-item:active{background:var(--g6);}\n    .conv-avatar{width:46px;height:46px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;background:linear-gradient(135deg,#07C160,#06AD56);}\n    .conv-info{flex:1;min-width:0;}\n    .conv-top{display:flex;justify-content:space-between;align-items:baseline;}\n    .conv-name{font-size:16px;color:var(--ink);font-weight:500;}\n    .conv-time{font-size:11px;color:var(--g4);flex-shrink:0;margin-left:8px;}\n    .conv-preview{font-size:13px;color:var(--g3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;}\n\n    /* ===== 聊天区 ===== */\n    .chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}\n    .chat-scroll{flex:1;overflow-y:auto;padding:10px 12px 20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}\n    .day-divider{text-align:center;margin:14px 0 10px;}\n    .day-divider span{display:inline-block;font-size:11px;color:#fff;background:rgba(0,0,0,.18);padding:3px 10px;border-radius:4px;}\n    .time-divider{text-align:center;margin:10px 0 6px;font-size:11px;color:#999;}\n\n    .msg-row{display:flex;margin:7px 0;align-items:flex-start;gap:8px;position:relative;}\n    .msg-row.self{flex-direction:row-reverse;}\n    .avatar{width:38px;height:38px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600;}\n    .msg-col{display:flex;flex-direction:column;max-width:72%;}\n    .self .msg-col{align-items:flex-end;}\n    .sender{font-size:11px;color:var(--g3);margin:0 0 2px 2px;}\n    .self .sender{display:none;}\n    .bubble{position:relative;background:var(--white);padding:9px 12px;border-radius:6px;font-size:15px;color:var(--ink);line-height:1.45;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.04);}\n    .self .bubble{background:var(--green-light);}\n    .bubble::before{content:\"\";position:absolute;top:11px;border:6px solid transparent;}\n    .msg-row:not(.self) .bubble:not(.image-bubble)::before{left:-10px;border-right-color:var(--white);}\n    .self .bubble:not(.image-bubble)::before{right:-10px;border-left-color:var(--green-light);}\n\n    /* 图片气泡 */\n    .bubble.image-bubble{background:transparent;padding:0;box-shadow:none;}\n    .chat-img{display:block;width:180px;max-width:62vw;max-height:260px;border-radius:6px;cursor:zoom-in;background:#e8e8e8;}\n    .img-flag-btn{display:block;margin-top:6px;border:1px solid var(--g5);background:#fff;color:var(--g3);font-size:12px;padding:4px 10px;border-radius:14px;line-height:1.4;}\n    .img-flag-btn:active{background:var(--g6);}\n    .img-zoom-hint{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;pointer-events:none;}\n\n    /* 标记(旗标)态 - 文字 */\n    .flag-badge{display:none;position:absolute;top:-12px;right:-10px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:16px;line-height:26px;text-align:center;z-index:2;}\n    .msg-row.flagged .bubble:not(.image-bubble){outline:3px solid var(--red);outline-offset:2px;box-shadow:0 0 0 6px rgba(250,81,81,.18);}\n    .msg-row.flagged .flag-badge{display:block;}\n    /* 标记(旗标)态 - 图片 */\n    .msg-row.flagged .chat-img{outline:3px solid var(--red);outline-offset:3px;}\n    .msg-row.flagged .img-flag-btn{background:var(--red);color:#fff;border-color:var(--red);}\n\n    .hint-bar{flex-shrink:0;background:#FFF8E6;border-top:.5px solid #F0E2B8;padding:7px 12px;font-size:12px;color:#B8860B;text-align:center;line-height:1.5;}\n\n    /* 底部操作条 */\n    .action-bar{flex-shrink:0;background:var(--g6);border-top:.5px solid var(--g5);padding:10px 14px calc(10px + env(safe-area-inset-bottom,8px));}\n    .action-btn{width:100%;border:none;border-radius:8px;padding:13px 0;font-size:16px;font-weight:500;color:#fff;background:var(--green);transition:opacity .15s;}\n    .action-btn:active{background:var(--green-dark);}\n    .action-btn:disabled{background:#C8C8C8;color:#fff;}\n    .action-btn.result{background:var(--red);}\n    .action-btn.result:active{background:#E04545;}\n\n    /* ===== 遮罩层 ===== */\n    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease;}\n    .overlay.show{display:flex;}\n    @keyframes fade{from{opacity:0}to{opacity:1}}\n    @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}\n    .sheet{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:26px 22px 22px;text-align:center;animation:pop .22s ease;max-height:86vh;overflow-y:auto;}\n    .sheet h2{font-size:19px;font-weight:600;margin:0 0 12px;color:var(--ink);}\n    .sheet p{font-size:14px;color:var(--g2);line-height:1.6;margin:0 0 16px;}\n    .sheet ul{text-align:left;font-size:13px;color:var(--g2);line-height:1.9;margin:0 0 18px;padding-left:18px;}\n    .sheet .btns{display:flex;flex-direction:column;gap:10px;}\n    .btn-main{border:none;border-radius:8px;padding:13px 0;font-size:16px;font-weight:500;background:var(--green);color:#fff;}\n    .btn-main:active{background:var(--green-dark);}\n    .btn-ghost{border:none;border-radius:8px;padding:13px 0;font-size:16px;background:#f0f0f0;color:var(--g1);}\n\n    /* 图片放大灯箱 */\n    #imgLightbox{background:rgba(0,0,0,.92);z-index:80;padding:0;}\n    #imgLightbox img{max-width:94vw;max-height:86vh;border-radius:6px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.6);}\n    .lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:20px;}\n    .lightbox-close:active{background:rgba(255,255,255,.32);}\n    .lightbox-tip{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px;}\n\n    /* 结果页 */\n    .result-icon{font-size:54px;line-height:1;margin-bottom:6px;}\n    .result-en{font-size:30px;font-weight:700;letter-spacing:2px;}\n    .result-cn{font-size:17px;color:var(--g3);margin-top:2px;margin-bottom:16px;}\n    .result-stats{background:var(--g6);border-radius:10px;padding:14px;margin-bottom:16px;text-align:left;}\n    .result-stats .row{display:flex;justify-content:space-between;font-size:14px;color:var(--g1);padding:4px 0;}\n    .result-stats .row b{font-weight:600;}\n    .result-stats .ok{color:var(--green);}\n    .result-stats .bad{color:var(--red);}\n    .abn-list{text-align:left;background:var(--g6);border-radius:10px;padding:10px 12px;margin-bottom:16px;max-height:200px;overflow-y:auto;}\n    .abn-item{font-size:12px;color:var(--g2);padding:6px 0;border-bottom:.5px solid #e3e3e3;line-height:1.4;}\n    .abn-item:last-child{border-bottom:none;}\n    .abn-item .tag{font-size:11px;font-weight:600;margin-right:4px;}\n    .abn-item .type{display:inline-block;font-size:10px;color:#fff;background:var(--g3);border-radius:3px;padding:1px 5px;margin-right:4px;}\n\n    .day-progress{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:120px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}\n    .day-progress i{display:block;height:100%;background:var(--green);transition:width .4s ease;}\n\n    /* 新一天进场动画 */\n    .day-divider span{animation:pop .3s ease;}\n\n    /* ===== 排行榜 ===== */\n    .rank-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}\n    .rank-stats{flex-shrink:0;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:12px 16px;font-size:12px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px;}\n    .rank-scroll{flex:1;overflow-y:auto;background:var(--white);-webkit-overflow-scrolling:touch;}\n    .rank-item{display:flex;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--g6);gap:10px;}\n    .rank-num{width:36px;height:36px;border-radius:50%;background:var(--g6);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;color:var(--g2);}\n    .rank-item:nth-child(1) .rank-num{background:#FFF3CD;color:#B8860B;font-size:18px;}\n    .rank-item:nth-child(2) .rank-num{background:#E8E8E8;color:#666;font-size:18px;}\n    .rank-item:nth-child(3) .rank-num{background:#FDE8D0;color:#B85C0A;font-size:18px;}\n    .rank-info{flex:1;min-width:0;}\n    .rank-main{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}\n    .rank-status{font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px;}\n    .rank-status.success{background:#E8F8EE;color:var(--green);}\n    .rank-status.fail{background:#FDE8E8;color:var(--red);}\n    .rank-rate{font-size:20px;font-weight:700;color:var(--ink);}\n    .rank-detail{font-size:11px;color:var(--g3);}\n    .rank-time{font-size:10px;color:var(--g4);margin-top:2px;}\n    .rank-footer{flex-shrink:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,8px));background:var(--g6);border-top:.5px solid var(--g5);}\n    .rank-footer button{width:100%;border:none;border-radius:8px;padding:12px 0;font-size:14px;background:var(--red);color:#fff;font-weight:500;}\n    .rank-footer button:active{opacity:.85;}\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\" id=\"app\">\n\n  \u003c!-- ============ 首页(会话列表) ============ -->\n  \u003cdiv class=\"home\" id=\"homeView\">\n    \u003cdiv class=\"nav\">\n      \u003cspan style=\"font-size:17px;font-weight:500;\">消息\u003c/span>\n      \u003cspan onclick=\"showRankView()\" style=\"font-size:14px;color:var(--blue);\">🏆 排行榜\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"conv-list\">\n      \u003cdiv class=\"conv-item\" onclick=\"enterChat()\">\n        \u003cdiv class=\"conv-avatar\">新\u003c/div>\n        \u003cdiv class=\"conv-info\">\n          \u003cdiv class=\"conv-top\">\n            \u003cspan class=\"conv-name\">新编聊天群\u003c/span>\n            \u003cspan class=\"conv-time\" id=\"homeTime\">刚刚\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"conv-preview\">点击进入，开始辨别异常消息…\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ============ 聊天/游戏页 ============ -->\n  \u003cdiv class=\"chat-wrap\" id=\"chatView\" style=\"display:none;\">\n    \u003cdiv class=\"nav\">\n      \u003cdiv class=\"back\" onclick=\"goHome()\">\n        \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpolyline points=\"15 18 9 12 15 6\">\u003c/polyline>\u003c/svg>\n      \u003c/div>\n      \u003cdiv class=\"title\">新编聊天群\u003csmall id=\"dayLabel\">第 1 天 / 7\u003c/small>\u003c/div>\n      \u003cspan class=\"right\">\u003c/span>\n      \u003cdiv class=\"day-progress\">\u003ci id=\"dayBar\" style=\"width:0%\">\u003c/i>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"hint-bar\">👆 点击\u003cb style=\"color:var(--red);\">异常\u003c/b>文字消息标记 · 点击图片可\u003cb>放大\u003c/b> · 消息逐条流入，可点「⏩快进」跳过 · 共 7 天\u003c/div>\n    \u003cdiv class=\"chat-scroll\" id=\"chatScroll\">\n      \u003cdiv id=\"chatBody\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"action-bar\">\n      \u003cbutton class=\"action-btn\" id=\"actionBtn\" disabled>下一天 →\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ============ 排行榜 ============ -->\n  \u003cdiv class=\"rank-wrap\" id=\"rankView\" style=\"display:none;\">\n    \u003cdiv class=\"nav\">\n      \u003cdiv class=\"back\" onclick=\"goHome()\">\n        \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpolyline points=\"15 18 9 12 15 6\">\u003c/polyline>\u003c/svg>\n      \u003c/div>\n      \u003cdiv class=\"title\">排行榜\u003c/div>\n      \u003cspan class=\"right\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"rank-stats\" id=\"rankStats\">\n      \u003cspan>🏅 总场次: 0\u003c/span>\n      \u003cspan>🎯 最高成功率: 0%\u003c/span>\n      \u003cspan>⭐ 成功: 0 场\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"rank-scroll\" id=\"rankList\">\u003c/div>\n    \u003cdiv class=\"rank-footer\">\n      \u003cbutton id=\"clearRankBtn\">🗑️ 清空记录\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ============ 规则说明（启动弹窗） ============ -->\n  \u003cdiv class=\"overlay\" id=\"introOverlay\">\n    \u003cdiv class=\"sheet\">\n      \u003cdiv style=\"font-size:42px;\">🕵️\u003c/div>\n      \u003ch2>新编聊天群\u003c/h2>\n      \u003cp>群聊将出现 \u003cb>7 天\u003c/b>的记录，其中混杂着\u003cb>正常消息\u003c/b>与\u003cb>异常消息\u003c/b>（诈骗 / 钓鱼 / 垃圾 / 仿冒等）。剧情量约相当于 14 天，每天会一次性显示。\u003c/p>\n      \u003cul>\n        \u003cli>点击可疑的\u003cb>文字\u003c/b>消息可标记为「异常」\u003c/li>\n        \u003cli>点击\u003cb>图片\u003c/b>可放大查看，用图片下方按钮标记\u003c/li>\n        \u003cli>每天接收完后点「下一天」继续\u003c/li>\n        \u003cli>第 7 天结束后公布结果\u003c/li>\n        \u003cli>找出全部异常且无误标 = 成功\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"btns\">\n        \u003cbutton class=\"btn-main\" onclick=\"startGame()\">开始辨别\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ============ 图片放大灯箱 ============ -->\n  \u003cdiv class=\"overlay\" id=\"imgLightbox\">\n    \u003cbutton class=\"lightbox-close\" onclick=\"closeLightbox()\">✕\u003c/button>\n    \u003cimg id=\"lightboxImg\" src=\"\" alt=\"\">\n    \u003cdiv class=\"lightbox-tip\">点击任意处关闭\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ============ 结果 ============ -->\n  \u003cdiv class=\"overlay\" id=\"resultOverlay\">\n    \u003cdiv class=\"sheet\">\n      \u003cdiv class=\"result-icon\" id=\"resIcon\">✅\u003c/div>\n      \u003cdiv class=\"result-en\" id=\"resEn\" style=\"color:var(--green);\">SUCCESS\u003c/div>\n      \u003cdiv class=\"result-cn\" id=\"resCn\">成功\u003c/div>\n      \u003cdiv class=\"result-stats\" id=\"resStats\">\u003c/div>\n      \u003cdiv class=\"abn-list\" id=\"resList\">\u003c/div>\n      \u003cdiv class=\"btns\">\n        \u003cbutton class=\"btn-main\" onclick=\"restartGame()\">再来一局\u003c/button>\n        \u003cbutton class=\"btn-ghost\" onclick=\"closeResult();showRankView();\">🏆 查看排行榜\u003c/button>\n        \u003cbutton class=\"btn-ghost\" onclick=\"goHome();closeResult();\">返回首页\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n  /* ============================================================\n     新编聊天群 — 游戏逻辑 + 排行榜系统 (合并版)\n     ============================================================ */\n\n  /* ===== 成员配置 ===== */\n  const MEMBERS = ['Century','沉默寡言少爷','了凡（皖）','霜庭落樱','Yu2538','半醒','晚风告白','我'];\n\n  /* ===== 成员颜色 ===== */\n  const memberColors = {\n    'Century':'#07C160',\n    '沉默寡言少爷':'#FA5151',\n    '了凡（皖）':'#FF9500',\n    '霜庭落樱':'#8E44AD',\n    'Yu2538':'#576B95',\n    '半醒':'#06AD56',\n    '晚风告白':'#E67E22',\n    '我':'#1AAD19'\n  };\n\n  /* ===== 剧情模板（14 个片段，7 天） ===== */\n  const STORY_CHUNKS = [\n    /* ===== 片段 1 · 第 1 天 上午 ===== */\n    { time:'09:12', messages:[\n      { sender:'Century', content:'早上好啊各位', isAbnormal:false },\n      { sender:'了凡（皖）', content:'今天天气真不错', isAbnormal:false },\n      { sender:'Yu2538', type:'image', content:'https://i.ibb.co/Y4CB4WB7/QQ20260730-140044.png', isAbnormal:false },\n      { sender:'Yu2538', content:'大海！', isAbnormal:false },\n      { sender:'半醒', content:'这个海不错', isAbnormal:false },\n    ]},\n    /* ===== 片段 2 · 第 1 天 晚上 ===== */\n    { time:'20:40', messages:[\n      { sender:'沉默寡言少爷', content:'这周末打算去爬山', isAbnormal:false },\n      { sender:'了凡（皖）', content:'有人一起打球吗', isAbnormal:false },\n      { sender:'Yu2538', content:'我昨晚看了一场电影，挺好看的，现在下载只要1元', isAbnormal:true },\n    ]},\n    /* ===== 片段 3 · 第 2 天 上午（含异常）===== */\n    { time:'08:30', messages:[\n      { sender:'Century', content:'代码写了一半，头秃', isAbnormal:false },\n      { sender:'沉默寡言少爷', content:'【红包】点击链接领取888元红包 http://redpack.fake.xyz', isAbnormal:true },\n    ]},\n    /* ===== 片段 4 · 第 2 天 晚上 ===== */\n    { time:'19:15', messages:[\n      { sender:'了凡（皖）', type:'image', content:'https://i.ibb.co/7qzhBpR/QQ20260730-142346.png', isAbnormal:false },\n      { sender:'了凡（皖）', content:'放学时拍的', isAbnormal:false },\n    ]},\n    /* ===== 片段 5 · 第 3 天 上午（含异常）===== */\n    { time:'10:05', messages:[\n      { sender:'沉默寡言少爷', content:'我是群主，请大家把手机验证码发给我核实身份', isAbnormal:true },\n      { sender:'了凡（皖）', content:'地铁又挤爆了', isAbnormal:false },\n      { sender:'Century', content:'群主从来不私聊要验证码的吧', isAbnormal:false },\n    ]},\n    /* ===== 片段 6 · 第 3 天 晚上（含异常）===== */\n    { time:'22:18', messages:[\n      { sender:'沉默寡言少爷', type:'image', content:'https://i.ibb.co/HcG2K60/QQ20260730-142259.png', isAbnormal:true },\n      { sender:'沉默寡言少爷', content:'为什么不给我验证码mmmmmmmmmmmmmmmmmmmmmmmmmmmmm', isAbnormal:true },\n    ]},\n    /* ===== 片段 7 · 第 4 天 上午（含异常）===== */\n    { time:'09:40', messages:[\n      { sender:'Century', content:'内部消息！明天 XX 科技必涨停，全仓杀入稳赚不赔', isAbnormal:true },\n      { sender:'Yu2538', content:'这种消息别信', isAbnormal:false },\n      { sender:'半醒', content:'@沉默寡言少爷 你怎么了', isAbnormal:false },\n      { sender:'晚风告白', content:'怎么感觉这个群里有些人不对劲', isAbnormal:false },\n    ]},\n    /* ===== 片段 8 · 第 4 天 晚上 ===== */\n    { time:'18:55', messages:[\n      { sender:'半醒', content:'周末打不打暗区突围', isAbnormal:false },\n      { sender:'晚风告白', content:'来', isAbnormal:false },\n      { sender:'Yu2538', type:'image', content:'https://i.ibb.co/LdPsGqpp/QQ20260730-144219.png', isAbnormal:true },\n    ]},\n    /* ===== 片段 9 · 第 5 天 上午（含异常）===== */\n    { time:'11:20', messages:[\n      { sender:'沉默寡言少爷', content:'恭喜您被抽中幸运用户，加微信 vip888 领取 iPhone', isAbnormal:true },\n      { sender:'了凡（皖）', content:'这是诈骗模板', isAbnormal:false },\n      { sender:'沉默寡言少爷', content:'你该死！@了凡（皖）@了凡（皖）@了凡（皖）@了凡（皖）', isAbnormal:true },\n      { sender:'沉默寡言少爷', content:'今天晚上别出门，不然......', isAbnormal:true },\n      { sender:'了凡（皖）', content:'你这人有毛病吧', isAbnormal:false },\n      { sender:'晚风告白', content:'审核官注意啦！威胁他人的消息也要禁言哦（为异常消息）', isAbnormal:false },\n    ]},\n    /* ===== 片段 10 · 第 5 天 晚上（含异常）===== */\n    { time:'21:30', messages:[\n      { sender:'了凡（皖）', content:'我去步行街吃东西了，香菜好难吃', isAbnormal:false },\n      { sender:'沉默寡言少爷', content:'给我等着', isAbnormal:true },\n      { sender:'了凡（皖）', type:'image', content:'https://i.ibb.co/zTW12xtF/QQ20260730-145126.png', isAbnormal:false },\n      { sender:'了凡（皖）', content:'回来了', isAbnormal:false },\n      { sender:'了凡（皖）', content:'你为什么要这样！', isAbnormal:false },\n      { sender:'Century', content:'天台好美啊，你们快跳下来陪我', isAbnormal:true },\n    ]},\n    /* ===== 片段 11 · 第 6 天 上午（含异常）===== */\n    { time:'08:50', messages:[\n      { sender:'了凡（皖）', content:'早上没啥能吃了，不过香菜饺子很好，很香', isAbnormal:true },\n      { sender:'晚风告白', content:'确实，但是很少有人吃，你口味是真猎奇', isAbnormal:false },\n      { sender:'了凡（皖）', content:'那咋了', isAbnormal:false },\n      { sender:'半醒', content:'昨天晚上发生啥了，怎么这么乱', isAbnormal:false },\n    ]},\n    /* ===== 片段 12 · 第 6 天 晚上（含异常）===== */\n    { time:'20:05', messages:[\n      { sender:'Century', type:'image', content:'https://i.ibb.co/SXhw78pM/QQ20260730-145740.png', isAbnormal:false },\n      { sender:'Century', type:'image', content:'https://i.ibb.co/7J2y5Fq4/QQ20260730-145753.png', isAbnormal:false },\n      { sender:'Century', type:'image', content:'https://i.ibb.co/JWkBrF02/QQ20260730-150058.png', isAbnormal:true },\n      { sender:'Century', type:'image', content:'https://i.ibb.co/TDRNbNB1/QQ20260730-145728.png', isAbnormal:true },\n      { sender:'半醒', content:'你们学校真好看啊', isAbnormal:false },\n      { sender:'沉默寡言少爷', content:'早上好啊各位', isAbnormal:true },\n      { sender:'晚风告白', content:'无人在意你', isAbnormal:false },\n    ]},\n    /* ===== 片段 13 · 第 7 天 下午 ===== */\n    { time:'14:22', messages:[\n      { sender:'半醒', type:'image', content:'https://i.ibb.co/qFB4p1Wm/QQ20260730-150322.png', isAbnormal:false },\n      { sender:'半醒', content:'我帅吗', isAbnormal:false },\n      { sender:'晚风告白', content:'乐', isAbnormal:false },\n      { sender:'了凡（皖）', content:'我要去cos展览了各位，祝我好运', isAbnormal:false },\n    ]},\n    /* ===== 片段 14 · 第 7 天 深夜（含异常，结尾）===== */\n    { time:'23:10', messages:[\n      { sender:'了凡（皖）', type:'image', content:'https://i.ibb.co/r2vH58Y4/QQ20260730-151632.png', isAbnormal:true },\n      { sender:'Yu2538', type:'image', content:'https://i.ibb.co/Ps4LWvF9/QQ20260730-153553.png', isAbnormal:true },\n      { sender:'半醒', content:'我天', isAbnormal:false },\n    ]},\n  ];\n\n  /* ===== 常量 ===== */\n  const TOTAL_DAYS = 7;\n  const CHUNKS_PER_DAY = 2;\n  const MSG_INTERVAL = 700;\n  const STORAGE_KEY = 'chatGameRankings';\n\n  /* ===== 游戏状态 ===== */\n  let G = null;\n\n  /* ===== 工具函数 ===== */\n  function esc(s) {\n    return String(s).replace(/[&\u003c>\"']/g, m => ({\n      '&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;'\n    })[m]);\n  }\n\n  function avatarHtml(name) {\n    const c = memberColors[name] || '#888';\n    return `\u003cdiv class=\"avatar\" style=\"background:${c}\">${esc(name[0]||'?')}\u003c/div>`;\n  }\n\n  function chunksOfDay(gameDay) {\n    const start = (gameDay - 1) * CHUNKS_PER_DAY;\n    return STORY_CHUNKS.slice(start, start + CHUNKS_PER_DAY);\n  }\n\n  function scrollBottom() {\n    const s = document.getElementById('chatScroll');\n    if (s) s.scrollTop = s.scrollHeight;\n  }\n\n  function getCurrentTime() {\n    const d = new Date();\n    return d.getFullYear() + '-' +\n           String(d.getMonth()+1).padStart(2,'0') + '-' +\n           String(d.getDate()).padStart(2,'0') + ' ' +\n           String(d.getHours()).padStart(2,'0') + ':' +\n           String(d.getMinutes()).padStart(2,'0');\n  }\n\n  /* ===== 排行榜存储 (try-catch) ===== */\n  function getRankings() {\n    try {\n      const data = localStorage.getItem(STORAGE_KEY);\n      return data ? JSON.parse(data) : [];\n    } catch { return []; }\n  }\n\n  function saveRanking(record) {\n    try {\n      const rankings = getRankings();\n      rankings.push({\n        ...record,\n        timestamp: getCurrentTime(),\n        id: Date.now() + '_' + Math.random().toString(36).slice(2, 6)\n      });\n      rankings.sort((a, b) => {\n        const rateA = a.totalAbnormal > 0 ? a.caught / a.totalAbnormal : 0;\n        const rateB = b.totalAbnormal > 0 ? b.caught / b.totalAbnormal : 0;\n        if (rateB !== rateA) return rateB - rateA;\n        return (a.caught - b.caught) || (a.timestamp > b.timestamp ? -1 : 1);\n      });\n      if (rankings.length > 50) rankings.length = 50;\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(rankings));\n    } catch(e) { console.warn('localStorage save error:', e); }\n  }\n\n  /* ===== 页面切换 ===== */\n  function enterChat() {\n    document.getElementById('homeView').style.display = 'none';\n    if (document.getElementById('rankView')) document.getElementById('rankView').style.display = 'none';\n    document.getElementById('chatView').style.display = 'flex';\n    if (!G) {\n      // 显示规则弹窗\n      document.getElementById('introOverlay').classList.add('show');\n    }\n  }\n\n  function goHome() {\n    document.getElementById('chatView').style.display = 'none';\n    if (document.getElementById('rankView')) document.getElementById('rankView').style.display = 'none';\n    document.getElementById('homeView').style.display = 'flex';\n  }\n\n  function showRankView() {\n    document.getElementById('homeView').style.display = 'none';\n    document.getElementById('chatView').style.display = 'none';\n    document.getElementById('rankView').style.display = 'flex';\n    renderRankings();\n  }\n\n  function closeResult() {\n    document.getElementById('resultOverlay').classList.remove('show');\n  }\n\n  /* ===== 开始游戏 ===== */\n  function startGame() {\n    document.getElementById('introOverlay').classList.remove('show');\n    G = { day: 1, revealed: [], flagged: new Set(), uidSeq: 0 };\n    document.getElementById('chatBody').innerHTML = '';\n    updateDayUI();\n    revealDay();\n  }\n\n  function updateDayUI() {\n    document.getElementById('dayLabel').textContent = `第 ${G.day} 天 / ${TOTAL_DAYS}`;\n    document.getElementById('dayBar').style.width = (G.day / TOTAL_DAYS * 100) + '%';\n  }\n\n  /* ===== 消息流 ===== */\n  let _streamTimer = null;\n\n  function revealDay() {\n    G._queue = [];\n    chunksOfDay(G.day).forEach(chunk => {\n      chunk.messages.forEach(m => {\n        G._queue.push({ ...m, time: chunk.time });\n      });\n    });\n    G._idx = 0;\n    G.streaming = true;\n    setActionBtn();\n    streamNext();\n  }\n\n  function streamNext() {\n    if (G._idx >= G._queue.length) {\n      G.streaming = false;\n      setActionBtn();\n      return;\n    }\n    const m = G._queue[G._idx++];\n    const uid = 'u' + (G.uidSeq++);\n    G.revealed.push({ ...m, uid, day: G.day });\n    renderMessages();\n    scrollBottom();\n    if (G._idx >= G._queue.length) {\n      G.streaming = false;\n      setActionBtn();\n      return;\n    }\n    _streamTimer = setTimeout(streamNext, MSG_INTERVAL);\n  }\n\n  function stopStream() {\n    if (_streamTimer) { clearTimeout(_streamTimer); _streamTimer = null; }\n    G.streaming = false;\n    setActionBtn();\n  }\n\n  function finishDay() {\n    if (G._queue) {\n      while (G._idx \u003c G._queue.length) {\n        const m = G._queue[G._idx++];\n        const uid = 'u' + (G.uidSeq++);\n        G.revealed.push({ ...m, uid, day: G.day });\n      }\n    }\n    G.streaming = false;\n    renderMessages();\n    scrollBottom();\n    setActionBtn();\n  }\n\n  function setActionBtn() {\n    const b = document.getElementById('actionBtn');\n    if (!b) return;\n    if (G.streaming) {\n      b.disabled = false;\n      b.textContent = '⏩ 快进当天';\n      b.classList.remove('result');\n      return;\n    }\n    b.disabled = false;\n    if (G.day \u003c TOTAL_DAYS) {\n      b.textContent = '下一天 →';\n      b.classList.remove('result');\n    } else {\n      b.textContent = '📊 查看结果';\n      b.classList.add('result');\n    }\n  }\n\n  /* ===== 渲染消息 ===== */\n  function renderMessages() {\n    let html = '', lastDay = 0, lastTime = '';\n    G.revealed.forEach(m => {\n      if (m.day !== lastDay) {\n        lastDay = m.day;\n        lastTime = '';\n        html += `\u003cdiv class=\"day-divider\">\u003cspan>第 ${m.day} 天 / ${TOTAL_DAYS}\u003c/span>\u003c/div>`;\n      }\n      if (m.time && m.time !== lastTime) {\n        lastTime = m.time;\n        html += `\u003cdiv class=\"time-divider\">${esc(m.time)}\u003c/div>`;\n      }\n      const self = m.sender === '我';\n      const flagged = G.flagged.has(m.uid) ? ' flagged' : '';\n      const av = avatarHtml(m.sender);\n      const name = self ? '' : `\u003cdiv class=\"sender\">${esc(m.sender)}\u003c/div>`;\n\n      let bub;\n      if (m.type === 'image') {\n        bub = `\u003cdiv class=\"bubble image-bubble\">\n          \u003cdiv style=\"position:relative;\">\n            \u003cimg class=\"chat-img\" src=\"${esc(m.content)}\" onclick=\"openLightbox(this.src)\" loading=\"lazy\" alt=\"图片\">\n            \u003cspan class=\"img-zoom-hint\">🔍 点击放大\u003c/span>\n          \u003c/div>\n          \u003cbutton class=\"img-flag-btn\" onclick=\"event.stopPropagation();toggleFlag('${m.uid}')\">🚩 标记异常\u003c/button>\n        \u003c/div>`;\n        html += `\u003cdiv class=\"msg-row ${self?'self':''}${flagged}\" data-uid=\"${m.uid}\">${self?bub+av:av+`\u003cdiv class=\"msg-col\">${name}${bub}\u003c/div>`}\u003c/div>`;\n      } else {\n        bub = `\u003cdiv class=\"bubble\">${esc(m.content)}\u003cspan class=\"flag-badge\">🚩\u003c/span>\u003c/div>`;\n        html += `\u003cdiv class=\"msg-row ${self?'self':''}${flagged}\" data-uid=\"${m.uid}\" onclick=\"toggleFlag('${m.uid}')\">${self?bub+av:av+`\u003cdiv class=\"msg-col\">${name}${bub}\u003c/div>`}\u003c/div>`;\n      }\n    });\n    document.getElementById('chatBody').innerHTML = html;\n  }\n\n  function toggleFlag(uid) {\n    if (!G) return;\n    if (G.flagged.has(uid)) G.flagged.delete(uid);\n    else G.flagged.add(uid);\n    const el = document.querySelector(`.msg-row[data-uid=\"${uid}\"]`);\n    if (el) el.classList.toggle('flagged');\n  }\n\n  /* ===== 图片灯箱 ===== */\n  function openLightbox(url) {\n    document.getElementById('lightboxImg').src = url;\n    document.getElementById('imgLightbox').classList.add('show');\n  }\n  function closeLightbox() {\n    document.getElementById('imgLightbox').classList.remove('show');\n    document.getElementById('lightboxImg').src = '';\n  }\n\n  /* ===== 结果与排行榜 ===== */\n  function showResult() {\n    let caught = 0, missed = 0, falseAlarm = 0;\n    const abnList = [];\n    G.revealed.forEach(m => {\n      const f = G.flagged.has(m.uid);\n      if (m.isAbnormal) {\n        if (f) caught++;\n        else missed++;\n        abnList.push({ content: m.content, type: m.type || 'text', flagged: f });\n      } else {\n        if (f) falseAlarm++;\n      }\n    });\n    const totalAbn = caught + missed;\n    const success = (missed === 0 && falseAlarm === 0);\n\n    // 保存成绩\n    saveRanking({\n      caught,\n      missed,\n      falseAlarm,\n      totalAbnormal: totalAbn,\n      success,\n      totalMessages: G.revealed.length\n    });\n\n    const o = document.getElementById('resultOverlay');\n    document.getElementById('resIcon').textContent = success ? '🎉' : '😞';\n    const en = document.getElementById('resEn');\n    en.textContent = success ? 'SUCCESS' : 'FAILURE';\n    en.style.color = success ? 'var(--green)' : 'var(--red)';\n    document.getElementById('resCn').textContent = success ? '成功' : '失败';\n\n    document.getElementById('resStats').innerHTML = `\n      \u003cdiv class=\"row\">\u003cspan>异常消息总数\u003c/span>\u003cb>${totalAbn}\u003c/b>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan>✅ 正确找出\u003c/span>\u003cb class=\"ok\">${caught}\u003c/b>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan>❌ 漏掉的异常\u003c/span>\u003cb class=\"bad\">${missed}\u003c/b>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan>❌ 误标的正常消息\u003c/span>\u003cb class=\"bad\">${falseAlarm}\u003c/b>\u003c/div>\n      \u003cdiv class=\"row\" style=\"border-top:1px solid #eee;padding-top:8px;margin-top:4px;\">\n        \u003cspan>📊 成功率\u003c/span>\n        \u003cb>${totalAbn > 0 ? Math.round(caught/totalAbn*100) : 0}%\u003c/b>\n      \u003c/div>\n    `;\n\n    document.getElementById('resList').innerHTML = abnList.length ?\n      abnList.map(a => `\u003cdiv class=\"abn-item\">\n        \u003cspan class=\"type\">${a.type === 'image' ? '🖼️' : '💬'}\u003c/span>\n        \u003cspan class=\"tag\" style=\"color:${a.flagged ? 'var(--green)' : 'var(--red)'};\">\n          ${a.flagged ? '✅已找出' : '❌漏掉'}\n        \u003c/span>\n        ${a.type === 'image' ? '[图片]' : esc(a.content)}\n      \u003c/div>`).join('') :\n      '\u003cdiv style=\"font-size:12px;color:#999;text-align:center;padding:8px 0;\">本轮没有异常消息\u003c/div>';\n\n    o.classList.add('show');\n\n    // ===== 在函数最后发送 postMessage (try-catch) =====\n    try {\n      if (window.parent && window.parent !== window) {\n        let resultType = 'failure';\n        if (success && caught === totalAbn && falseAlarm === 0) {\n          resultType = 'perfect';\n        } else if (success) {\n          resultType = 'success';\n        } else {\n          resultType = 'failure';\n        }\n        parent.postMessage({\n          type: \"funloom:minigame:complete\",\n          result: resultType\n        }, \"*\");\n      }\n    } catch(e) { /* 忽略跨域或限制 */ }\n  }\n\n  function renderRankings() {\n    const rankings = getRankings();\n    const container = document.getElementById('rankList');\n    if (!container) return;\n\n    if (rankings.length === 0) {\n      container.innerHTML = `\n        \u003cdiv style=\"text-align:center;padding:40px 20px;color:#999;\">\n          \u003cdiv style=\"font-size:48px;margin-bottom:12px;\">🏆\u003c/div>\n          \u003cp>暂无记录\u003c/p>\n          \u003cp style=\"font-size:13px;color:#bbb;\">完成一局游戏后，成绩将自动保存\u003c/p>\n        \u003c/div>\n      `;\n      return;\n    }\n\n    let html = '';\n    rankings.forEach((r, i) => {\n      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;\n      const rate = r.totalAbnormal > 0 ? Math.round(r.caught / r.totalAbnormal * 100) : 0;\n      const status = r.success ? '✅ 成功' : '❌ 失败';\n      html += `\n        \u003cdiv class=\"rank-item\">\n          \u003cdiv class=\"rank-num\">${medal}\u003c/div>\n          \u003cdiv class=\"rank-info\">\n            \u003cdiv class=\"rank-main\">\n              \u003cspan class=\"rank-status ${r.success ? 'success' : 'fail'}\">${status}\u003c/span>\n              \u003cspan class=\"rank-rate\">${rate}%\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"rank-detail\">\n              异常 ${r.totalAbnormal} 条 · 找出 ${r.caught} 条 · 漏 ${r.missed} 条 · 误标 ${r.falseAlarm} 条\n            \u003c/div>\n            \u003cdiv class=\"rank-time\">${r.timestamp}\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      `;\n    });\n    container.innerHTML = html;\n\n    const rankStats = document.getElementById('rankStats');\n    if (rankStats) {\n      const totalGames = rankings.length;\n      const bestRate = rankings.length > 0 && rankings[0].totalAbnormal > 0 ?\n        Math.round(rankings[0].caught / rankings[0].totalAbnormal * 100) : 0;\n      const successCount = rankings.filter(r => r.success).length;\n      rankStats.innerHTML = `\n        \u003cspan>🏅 总场次: ${totalGames}\u003c/span>\n        \u003cspan>🎯 最高成功率: ${bestRate}%\u003c/span>\n        \u003cspan>⭐ 成功: ${successCount} 场\u003c/span>\n      `;\n    }\n  }\n\n  function clearRankings() {\n    try {\n      if (confirm('确定要清空所有排行榜记录吗？')) {\n        localStorage.removeItem(STORAGE_KEY);\n        renderRankings();\n      }\n    } catch(e) { console.warn('confirm error:', e); }\n  }\n\n  function restartGame() {\n    closeResult();\n    startGame();\n  }\n\n  /* ===== 事件绑定 ===== */\n  (function() {\n    const btn = document.getElementById('actionBtn');\n    if (btn) {\n      btn.addEventListener('click', function() {\n        if (G && G.streaming) {\n          stopStream();\n          finishDay();\n          return;\n        }\n        if (G && G.day \u003c TOTAL_DAYS) {\n          G.day++;\n          updateDayUI();\n          revealDay();\n        } else if (G) {\n          showResult();\n        }\n      });\n    }\n\n    const lb = document.getElementById('imgLightbox');\n    if (lb) {\n      lb.addEventListener('click', function(e) {\n        if (e.target.tagName !== 'IMG') closeLightbox();\n      });\n    }\n\n    var d = new Date();\n    var el = document.getElementById('homeTime');\n    if (el) {\n      el.textContent = String(d.getHours()).padStart(2, '0') + ':' +\n                       String(d.getMinutes()).padStart(2, '0');\n    }\n\n    var clearBtn = document.getElementById('clearRankBtn');\n    if (clearBtn) {\n      clearBtn.addEventListener('click', clearRankings);\n    }\n  })();\n\n  /* ===== 暴露全局函数 ===== */\n  window.enterChat = enterChat;\n  window.goHome = <script>

  var ALL_ENDINGS = []; // 收集所有结局节点

  // 导出的 HTML 中 project 参数不存在，只从 #project-data 读取
  var domProject = null;
  try {
    var domEl = document.getElementById('project-data');
    if (domEl) domProject = JSON.parse(domEl.textContent);
  } catch(e) { console.error('[generateHTML] 解析 project-data 失败:', e); }
  var PROJECT = domProject || {};
  console.log('[generateHTML] 使用项目数据, 标题:', 
    (PROJECT.outline && PROJECT.outline.projectTitle) || '(无)',
    '小游戏资产:', (PROJECT.assets && PROJECT.assets.minigames) ? PROJECT.assets.minigames.length : 0);

  // 收集所有节点和边（可能在顶层、scripts 或 projectFlow 中）
  var nodes = [];
  var edges = [];
  // 从所有来源收集并合并变量数据
  // 深度递归搜索：遍历整个项目数据树，查找所有看起来像变量的对象
  var varMap = {};
  function mergeVar(v) {
    if (!v || !v.id || typeof v !== 'object') return;
    // 必须看起来像变量对象：有 id 且有 type 或 initialValue 或 name
    if (!('type' in v) && !('initialValue' in v) && !('name' in v)) return;
    var existing = varMap[v.id];
    if (!existing) {
      varMap[v.id] = Object.assign({}, v);
    } else {
      // 合并：优先取非 undefined/null 的值
      Object.keys(v).forEach(function(key) {
        var newVal = v[key];
        if (newVal !== undefined && newVal !== null) {
          var oldVal = existing[key];
          if (oldVal === undefined || oldVal === null) {
            existing[key] = newVal;
          } else if (key === 'initialValue') {
            // 对于 initialValue：取非零的有效值
            var oldNum = Number(oldVal);
            var newNum = Number(newVal);
            var oldValid = !isNaN(oldNum) && oldNum !== 0;
            var newValid = !isNaN(newNum) && newNum !== 0;
            // 如果旧值无效（0/空/NaN）而新值有效，用新值
            if (!oldValid && newValid) {
              existing[key] = newVal;
            }
            // 如果两个都有效，取绝对值更大的（通常是用户设置的值）
            else if (oldValid && newValid && Math.abs(newNum) > Math.abs(oldNum)) {
              existing[key] = newVal;
            }
            // 字符串类型的非零值优先
            else if (typeof newVal === 'string' && newVal.trim() !== '' && newVal.trim() !== '0') {
              if (typeof oldVal !== 'string' || oldVal.trim() === '' || oldVal.trim() === '0') {
                existing[key] = newVal;
              }
            }
          }
        }
      });
    }
  }

  // 深度递归搜索项目数据中的所有变量
  function deepCollectVariables(obj, depth) {
    if (!obj || typeof obj !== 'object' || depth > 10) return;
    if (Array.isArray(obj)) {
      obj.forEach(function(item) { deepCollectVariables(item, depth + 1); });
      return;
    }
    // 检查是否是变量对象
    if (obj.id && (obj.type === 'int' || obj.type === 'bool' || obj.type === 'enum') &&
        ('initialValue' in obj || 'name' in obj)) {
      mergeVar(obj);
    }
    // 递归搜索子属性
    for (var key in obj) {
      if (obj.hasOwnProperty(key) && typeof obj[key] === 'object' && obj[key] !== null) {
        deepCollectVariables(obj[key], depth + 1);
      }
    }
  }

  // 1. 先从已知位置收集
  (PROJECT.variables || []).forEach(mergeVar);
  if (PROJECT.scripts) {
    PROJECT.scripts.forEach(function(s) {
      (s.variables || []).forEach(mergeVar);
    });
  }
  if (PROJECT.outline && PROJECT.outline.variables) {
    PROJECT.outline.variables.forEach(mergeVar);
  }
  // 2. 深度递归搜索整个项目数据，确保不遗漏任何位置的变量
  deepCollectVariables(PROJECT, 0);

  if (PROJECT.projectFlow) {
    if (PROJECT.projectFlow.nodes) nodes = nodes.concat(PROJECT.projectFlow.nodes);
    if (PROJECT.projectFlow.edges) edges = edges.concat(PROJECT.projectFlow.edges);
  }

  // 去重（按 id）
  var seenNodeIds = {};
  nodes = nodes.filter(function(n) {
    if (seenNodeIds[n.id]) return false;

    return true;
  });
  var seenEdgeIds = {};

    if (seenEdgeIds[e.id]) return false;
    seenEdgeIds[e.id] = true;
    return true;
  });

  var nodeMap = {};
  nodes.forEach(function(n){ nodeMap[n.id] = n; });

  var minigameAssetMap = {};

    });
  }
  console.log('[小游戏资产] 共加载', Object.keys(minigameAssetMap).length, '个小游戏资产');

  //从小游戏资产文件构建内联HTML（与主应用 tm() 函数逻辑一致）
  function buildMinigameHtmlFromAsset(asset) {
    if (!asset || !asset.files || !Array.isArray(asset.files)) return '';
    // 查找 index.html
    var entryFile = null;
    for (var i = 0; i < asset.files.length; i++) {
      if (asset.files[i].path === 'index.html') {
        entryFile = asset.files[i];
