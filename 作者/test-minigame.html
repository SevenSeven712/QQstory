<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏渲染测试</title>
<style>
:root{
  --bg:#0f1115;--card:#1a1d24;--border:#2a2e38;--text:#e2e4e9;--text-dim:#8b92a8;
  --accent:#5b8cff;--accent-dim:#3d5a99;--plot:#4ade80;--option:#fbbf24;
  --ending:#f87171;--minigame:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
#game-root{width:100%;max-width:800px;min-height:600px;padding:20px}
.node-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
.node-title{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.node-type-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.node-type-badge.minigame{background:rgba(167,139,250,.15);color:var(--minigame)}
.mg-embed-wrap{position:relative;width:100%;margin-top:12px}
.mg-iframe{width:100%;height:500px;border:1px solid var(--border);border-radius:12px;background:#000;transition:opacity .3s ease}
.mg-iframe.mg-done{opacity:.4;pointer-events:none}
.mg-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:12px;color:var(--text-dim);font-size:.9rem}
.mg-feedback{animation:mgPopIn .4s ease;text-align:center;padding:20px;border-radius:12px;font-size:1rem}
.mg-feedback .mg-fb-icon{font-size:2.5rem;margin-bottom:8px}
.mg-feedback .mg-fb-title{font-size:1.4rem;font-weight:700}
.mg-feedback .mg-fb-sub{font-size:.85rem;color:var(--text-dim);margin-top:6px}
@keyframes mgPopIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
button{cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<h1 style="padding:20px;">小游戏渲染测试</h1>
<div id="game-root"></div>
<script>
// 模拟导出的游戏数据
var PROJECT = {
  nodes: [
    {
      id: "start",
      type: "start",
      data: { kind: "start", title: "游戏入口", body: "" }
    },
    {
      id: "plot-1",
      type: "plot",
      data: {
        kind: "plot",
        title: "剧情节点",
        body: "你来到了一个神秘的地方，要不要玩个小游戏？",
        options: [
          { id: "opt-play", title: "玩游戏", body: "" }
        ]
      }
    },
    {
      id: "minigame-1",
      type: "minigame",
      data: {
        kind: "minigame",
        title: "猜数字游戏",
        body: "",
        minigameEmbedType: "html",
        minigameHtmlCode: '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;background:#1a1d24;color:#e2e4e9;text-align:center;padding:40px}h1{color:#a78bfa}button{padding:10px 20px;margin:5px;border-radius:8px;border:1px solid #2a2e38;background:#1a1d24;color:#e2e4e9;cursor:pointer;font-size:16px}button:hover{border-color:#a78bfa}input{padding:10px;border-radius:8px;border:1px solid #2a2e38;background:#0f1115;color:#e2e4e9;font-size:16px}#msg{margin-top:20px;font-size:18px}</style></head><body><h1>猜数字游戏</h1><p>猜一个1-10的数字</p><input type="number" id="guess" min="1" max="10" placeholder="输入1-10"><br><button onclick="check()">提交</button><div id="msg"></div><script>var answer=Math.floor(Math.random()*10)+1;var tries=3;function postResult(result){try{var origin=window.parent.location.origin;parent.postMessage({type:"funloom:minigame:complete",result:result},origin)}catch(e){parent.postMessage({type:"funloom:minigame:complete",result:result},"*")}}function check(){var g=parseInt(document.getElementById("guess").value);tries--;if(g===answer){document.getElementById("msg").textContent="恭喜你猜对了！";postResult("success");}else if(tries>0){document.getElementById("msg").textContent="不对哦，还剩"+tries+"次机会";}else{document.getElementById("msg").textContent="游戏结束！答案是"+answer;postResult("failure");}}<\/script></body></html>',
        minigameResults: [
          { id: "success", label: "成功" },
          { id: "failure", label: "失败" }
        ],
        minigameResultMutations: {}
      }
    },
    {
      id: "plot-success",
      type: "plot",
      data: {
        kind: "plot",
        title: "胜利剧情",
        body: "你赢了！继续冒险...",
      }
    },
    {
      id: "plot-failure",
      type: "plot",
      data: {
        kind: "plot",
        title: "失败剧情",
        body: "你输了，但还是继续吧...",
      }
    }
  ],
  edges: [
    { id: "e1", source: "start", target: "plot-1" },
    { id: "e2", source: "plot-1", sourceHandle: "option:opt-play", target: "minigame-1" },
    { id: "e3", source: "minigame-1", sourceHandle: "minigame-end:success", target: "plot-success" },
    { id: "e4", source: "minigame-1", sourceHandle: "minigame-end:failure", target: "plot-failure" }
  ]
};

// 构建查找表
var nodeMap = {};
var outgoingMap = {};
PROJECT.nodes.forEach(function(n){ nodeMap[n.id] = n; });
PROJECT.edges.forEach(function(e){
  if(!outgoingMap[e.source]) outgoingMap[e.source] = [];
  outgoingMap[e.source].push(e);
});

function getEdgeSourceEndId(e){
  if(!e.sourceHandle) return null;
  if(e.sourceHandle.indexOf('minigame-end:') === 0) return e.sourceHandle.slice(13);
  return null;
}
function getEdgeSourceOptionId(e){
  if(!e.sourceHandle) return null;
  if(e.sourceHandle.indexOf('option:') === 0) return e.sourceHandle.slice(7);
  return null;
}

function escapeText(s){
  if(typeof s !== 'string') s = String(s || '');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var root = document.getElementById('game-root');
var nodeHistory = [];

function findNextNode(node){
  var edges = outgoingMap[node.id] || [];
  var edge = edges.find(function(e){ return getEdgeSourceOptionId(e) === null && getEdgeSourceEndId(e) === null; });
  if(!edge) edge = edges[0];
  return edge ? nodeMap[edge.target] : null;
}

function findOptionTarget(node, optId, optIdx){
  var edges = outgoingMap[node.id] || [];
  var edge = edges.find(function(e){ return getEdgeSourceOptionId(e) === optId; });
  if(!edge) edge = edges[edges.length - 1];
  return edge ? nodeMap[edge.target] : null;
}

function renderNode(node){
  if(!node){ root.innerHTML = '<div class="node-card"><div class="node-title">剧情已结束</div></div>'; return; }

  var data = node.data || {};
  var kind = data.kind || node.type || 'plot';
  var isMinigame = kind === 'minigame';

  nodeHistory.push(node.id);

  var card = document.createElement('div');
  card.className = 'node-card' + (isMinigame ? ' minigame' : '');

  var typeLabel = isMinigame ? '小游戏' : '剧情';
  var html = '<span class="node-type-badge minigame">' + typeLabel + '</span>';
  if(data.title) html += '<div class="node-title">' + escapeText(data.title) + '</div>';

  // 小游戏嵌入渲染
  if(kind === 'minigame'){
    var mgEmbedType = data.minigameEmbedType || '';
    var mgHtmlCode = data.minigameHtmlCode || '';
    var mgGameUrl = data.minigameUrl || '';
    var hasEmbed = (mgEmbedType === 'html' && mgHtmlCode) || (mgEmbedType === 'url' && mgGameUrl);

    console.log('[小游戏诊断] 节点', node.id, {
      minigameEmbedType: mgEmbedType,
      hasHtmlCode: !!mgHtmlCode,
      htmlCodeLength: mgHtmlCode ? mgHtmlCode.length : 0,
      hasUrl: !!mgGameUrl,
      url: mgGameUrl,
      hasEmbed: !!hasEmbed
    });

    if(hasEmbed){
      html += '<div class="mg-embed-wrap vn-options">';
      html += '<div class="mg-loading">小游戏加载中...</div>';
      if(mgEmbedType === 'html'){
        html += '<iframe class="mg-iframe" data-mg-mode="html" data-mg-code="' + escapeText(mgHtmlCode) + '" style="display:none;" allow="autoplay; fullscreen"></iframe>';
      } else {
        html += '<iframe class="mg-iframe" data-mg-mode="url" src="' + escapeText(mgGameUrl) + '" style="display:none;" allow="autoplay; fullscreen"></iframe>';
      }
      html += '<div class="mg-feedback" style="display:none;margin-top:12px;"></div>';
      html += '</div>';
    } else {
      var results = data.minigameResults || [{ id: 'success', label: '成功' }, { id: 'failure', label: '失败' }];
      html += '<div class="vn-options">';
      results.forEach(function(r){
        html += '<button class="option-btn" data-result-id="' + escapeText(r.id) + '"><div class="option-title">' + escapeText(r.label || r.id) + '</div></button>';
      });
      html += '</div>';
    }
  } else if(kind === 'plot'){
    if(data.body){
      html += '<div class="node-body">' + escapeText(data.body) + '</div>';
    }
    if(data.options && data.options.length > 0){
      html += '<div class="vn-options">';
      data.options.forEach(function(opt, idx){
        html += '<button class="option-btn" data-opt-id="' + escapeText(opt.id) + '" data-opt-idx="' + idx + '"><div class="option-title">' + escapeText(opt.title) + '</div></button>';
      });
      html += '</div>';
    } else {
      var nextNode = findNextNode(node);
      html += '<div class="vn-options">';
      html += nextNode ? '（继续...）' : '没有后续剧情了';
      html += '</div>';
    }
  } else if(kind === 'start'){
    html += '<button class="option-btn" onclick="startGame()"><div class="option-title">开始游戏</div></button>';
  }

  card.innerHTML = html;
  root.innerHTML = '';
  root.appendChild(card);

  // 嵌入型小游戏：直接显示游戏
  var hasEmbedCheck = (data.minigameEmbedType === 'html' && data.minigameHtmlCode) || (data.minigameEmbedType === 'url' && data.minigameUrl);
  var isEmbeddedMinigame = kind === 'minigame' && hasEmbedCheck;

  if(isEmbeddedMinigame){
    var mgIframe = card.querySelector('.mg-iframe');
    var mgLoading = card.querySelector('.mg-loading');
    var mgEmbedWrap = card.querySelector('.mg-embed-wrap');

    if(mgIframe && mgIframe.getAttribute('data-mg-mode') === 'html'){
      var rawCode = mgIframe.getAttribute('data-mg-code') || '';
      var loadTier = 0; // 0=blob, 1=data-uri, 2=srcdoc, 3=fallback-button
      var loadCheckTimer = null;
      var loadSuccess = false;

      // 检测 iframe 是否加载成功（通过尝试访问 contentDocument）
      function checkIframeLoaded(iframe, callback){
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          // 如果能访问且 body 有内容，说明加载成功
          if(doc && doc.readyState === 'complete' && doc.body && doc.body.innerHTML.length > 0){
            callback(true);
            return;
          }
        } catch(e){
          // 跨域无法访问，通过 onload 事件判断
        }
        // 如果2秒后仍未确认成功
        callback(false);
      }

      // 方法1: Blob URL（兼容安卓）
      function tryBlobUrl(){
        loadTier = 0;
        console.log('[小游戏] 尝试 Blob URL 加载');
        try {
          var blob = new Blob([rawCode], { type: 'text/html;charset=utf-8' });
          var blobUrl = URL.createObjectURL(blob);
          mgIframe.onload = function(){
            loadSuccess = true;
            if(loadCheckTimer) clearTimeout(loadCheckTimer);
            console.log('[小游戏] Blob URL 加载成功');
          };
          mgIframe.src = blobUrl;
          mgIframe.style.display = '';
          if(mgLoading) mgLoading.style.display = 'none';

          // 2秒后检测是否加载成功
          loadCheckTimer = setTimeout(function(){
            if(!loadSuccess){
              console.log('[小游戏] Blob URL 2秒未加载成功，降级为 data URI');
              try { URL.revokeObjectURL(blobUrl); } catch(e) {}
              tryDataUri();
            }
          }, 2000);
        } catch(err) {
          console.log('[小游戏] Blob URL 创建失败，降级为 data URI', err);
          tryDataUri();
        }
      }

      // 方法2: data:text/html URI（兼容 iOS）
      function tryDataUri(){
        loadTier = 1;
        loadSuccess = false;
        console.log('[小游戏] 尝试 data URI 加载');
        try {
          var dataUri = 'data:text/html;charset=utf-8,' + encodeURIComponent(rawCode);
          mgIframe.onload = function(){
            loadSuccess = true;
            if(loadCheckTimer) clearTimeout(loadCheckTimer);
            console.log('[小游戏] data URI 加载成功');
          };
          mgIframe.src = dataUri;
          mgIframe.style.display = '';

          loadCheckTimer = setTimeout(function(){
            if(!loadSuccess){
              console.log('[小游戏] data URI 2秒未加载成功，降级为 srcdoc');
              trySrcdoc();
            }
          }, 2000);
        } catch(err) {
          console.log('[小游戏] data URI 创建失败，降级为 srcdoc', err);
          trySrcdoc();
        }
      }

      // 方法3: srcdoc + sandbox（最终降级）
      function trySrcdoc(){
        loadTier = 2;
        loadSuccess = false;
        console.log('[小游戏] 尝试 srcdoc 加载');
        try {
          mgIframe.removeAttribute('src');
          mgIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-pointer-lock');
          mgIframe.setAttribute('srcdoc', rawCode);
          mgIframe.style.display = '';

          // srcdoc 可能不触发 onload，用定时器检测
          loadCheckTimer = setTimeout(function(){
            console.log('[小游戏] srcdoc 已设置');
            loadSuccess = true; // srcdoc 通常能工作，假定成功
          }, 1000);

          // 额外3秒检测：如果仍未收到任何 postMessage 响应，显示降级按钮
          setTimeout(function(){
            if(!mgFinished){
              console.log('[小游戏] srcdoc 加载后无响应，显示降级按钮');
              showFallbackButton();
            }
          }, 5000);
        } catch(err) {
          console.log('[小游戏] srcdoc 设置失败，显示降级按钮', err);
          showFallbackButton();
        }
      }

      // 方法4: 降级按钮（所有加载方式都失败）
      function showFallbackButton(){
        loadTier = 3;
        if(loadCheckTimer) clearTimeout(loadCheckTimer);
        console.log('[小游戏] 所有加载方式失败，显示降级按钮');

        // 隐藏 iframe 和 loading
        if(mgIframe) mgIframe.style.display = 'none';
        if(mgLoading) mgLoading.style.display = 'none';

        // 查找 success 边指向的节点
        var outEdges = outgoingMap[node.id] || [];
        var successEdge = outEdges.find(function(ed){ return getEdgeSourceEndId(ed) === 'success'; });
        if(!successEdge) successEdge = outEdges[0];
        var fallbackNode = successEdge ? nodeMap[successEdge.target] : null;

        // 创建降级按钮
        var fallbackDiv = document.createElement('div');
        fallbackDiv.className = 'mg-fallback';
        fallbackDiv.style.cssText = 'padding:40px 20px;text-align:center;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.3);border-radius:12px;cursor:pointer;transition:background .2s;';
        fallbackDiv.innerHTML = '<div style="font-size:2rem;margin-bottom:8px;">🎮</div>' +
          '<div style="font-size:1rem;font-weight:600;color:var(--minigame,#a78bfa);margin-bottom:4px;">小游戏无法加载</div>' +
          '<div style="font-size:0.85rem;color:var(--text-dim,#8b92a8);margin-bottom:16px;">点击此处跳过小游戏，继续剧情</div>' +
          '<button style="padding:10px 24px;border-radius:8px;border:1px solid var(--minigame,#a78bfa);background:transparent;color:var(--minigame,#a78bfa);font-size:14px;font-weight:600;cursor:pointer;">点击此处继续剧情</button>';

        fallbackDiv.addEventListener('click', function(){
          if(mgFinished) return;
          mgFinished = true;

          // 显示反馈
          if(mgFbEl){
            mgFbEl.style.display = '';
            mgFbEl.style.background = 'rgba(167,139,250,.12)';
            mgFbEl.innerHTML = '<div class="mg-fb-icon">⏭️</div>' +
              '<div class="mg-fb-title" style="color:var(--minigame,#a78bfa)">已跳过小游戏</div>' +
              '<div class="mg-fb-sub">即将继续剧情...</div>';
          }

          // 跳转到后续节点
          setTimeout(function(){
            if(window._vnMgHandler){
              window.removeEventListener('message', window._vnMgHandler);
              window._vnMgHandler = null;
            }
            if(fallbackNode) renderNode(fallbackNode);
            else root.innerHTML = '<div class="node-card"><div class="node-title">剧情已结束</div></div>';
          }, 1500);
        });

        // 插入到 embed wrap 中
        if(mgEmbedWrap){
          mgEmbedWrap.appendChild(fallbackDiv);
        } else {
          card.appendChild(fallbackDiv);
        }
      }

      // 启动加载流程
      tryBlobUrl();

    } else if(mgIframe) {
      mgIframe.style.display = '';
      if(mgLoading) mgLoading.style.display = 'none';
    }

    // postMessage 监听
    if(window._vnMgHandler){
      window.removeEventListener('message', window._vnMgHandler);
    }
    var mgFbEl = card.querySelector('.mg-feedback');
    var mgIframeEl2 = card.querySelector('.mg-iframe');
    var mgFinished = false;
    var mgResultDefs = data.minigameResults || [{ id: 'success', label: '成功' }, { id: 'failure', label: '失败' }];

    function matchResultDef(val){
      if(!val) return null;
      var s = String(val);
      var m = mgResultDefs.find(function(r){ return r.id === s; });
      if(m) return m;
      m = mgResultDefs.find(function(r){ return r.label === s; });
      if(m) return m;
      m = mgResultDefs.find(function(r){ return String(r.id).toLowerCase() === s.toLowerCase(); });
      return m;
    }

    function extractResult(msgData){
      if(typeof msgData === 'string') return msgData;
      if(!msgData || typeof msgData !== 'object') return null;
      if(msgData.type === 'funloom:minigame:complete' || msgData.type === 'minigame:complete'){
        return msgData.result || msgData.resultId || 'success';
      }
      if(msgData.result) return msgData.result;
      if(msgData.resultId) return msgData.resultId;
      if(typeof msgData.success === 'boolean') return msgData.success ? 'success' : 'failure';
      return null;
    }

    window._vnMgHandler = function(e){
      if(mgFinished) return;
      var resultVal = extractResult(e.data);
      if(resultVal === null) return;
      mgFinished = true;

      console.log('[小游戏postMessage] 收到结果:', resultVal);
      var matched = matchResultDef(resultVal);
      var resultId = matched ? matched.id : resultVal;
      var resultLabel = matched ? (matched.label || matched.id) : resultVal;

      // 显示反馈
      if(mgFbEl){
        mgFbEl.style.display = '';
        var fbIcon = resultId === 'success' ? '✅' : '❌';
        var fbColor = resultId === 'success' ? 'var(--plot)' : 'var(--ending)';
        var fbBg = resultId === 'success' ? 'rgba(74,222,128,.12)' : 'rgba(248,113,113,.12)';
        mgFbEl.style.background = fbBg;
        mgFbEl.innerHTML = '<div class="mg-fb-icon">' + fbIcon + '</div>' +
          '<div class="mg-fb-title" style="color:' + fbColor + '">' + escapeText(resultLabel) + '</div>' +
          '<div class="mg-fb-sub">即将继续剧情...</div>';
      }
      if(mgIframeEl2) mgIframeEl2.classList.add('mg-done');

      // 查找边并跳转
      var outEdges = outgoingMap[node.id] || [];
      var targetEdge = outEdges.find(function(ed){ return getEdgeSourceEndId(ed) === resultId; });
      if(!targetEdge) targetEdge = outEdges.find(function(ed){ return getEdgeSourceEndId(ed) === resultVal; });
      if(!targetEdge) targetEdge = outEdges[0];
      var nextNode = targetEdge ? nodeMap[targetEdge.target] : null;

      console.log('[小游戏postMessage] 匹配边:', targetEdge ? targetEdge.id : '(无)', '-> 目标:', nextNode ? nextNode.id : '(无)');

      setTimeout(function(){
        if(window._vnMgHandler){
          window.removeEventListener('message', window._vnMgHandler);
          window._vnMgHandler = null;
        }
        if(nextNode) renderNode(nextNode);
        else root.innerHTML = '<div class="node-card"><div class="node-title">剧情已结束</div></div>';
      }, 2000);
    };
    window.addEventListener('message', window._vnMgHandler);
  }

  // 绑定选项点击
  var btns = card.querySelectorAll('.option-btn');
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      var optId = btn.getAttribute('data-opt-id');
      var optIdx = parseInt(btn.getAttribute('data-opt-idx'), 10);
      var resultId = btn.getAttribute('data-result-id');

      if(resultId){
        var outEdges = outgoingMap[node.id] || [];
        var edge = outEdges.find(function(e){ return getEdgeSourceEndId(e) === resultId; });
        if(!edge) edge = outEdges[0];
        var nextN = edge ? nodeMap[edge.target] : null;
        if(nextN) renderNode(nextN);
        return;
      }

      if(optId){
        var target = findOptionTarget(node, optId, optIdx);
        if(target) renderNode(target);
      }
    });
  });

  // 剧情节点自动跳转
  if(kind === 'plot' && (!data.options || data.options.length === 0)){
    var next = findNextNode(node);
    if(next){
      card.querySelector('.vn-options').addEventListener('click', function(){
        renderNode(next);
      });
    }
  }
}

function startGame(){
  var startNode = nodeMap["start"];
  var next = findNextNode(startNode);
  if(next) renderNode(next);
}

// 初始渲染
var startNode = nodeMap["start"];
renderNode(startNode);
</script>
</body>
</html>
